<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space.io</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02020e;font-family:'Share Tech Mono',monospace;color:#d0d0ff;overflow:hidden;height:100vh;width:100vw;user-select:none}
#sm,#sg,#sd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sm{background:radial-gradient(ellipse at 50% 40%,#08003a,#02020e 70%);z-index:10}
.logo{font-family:'Orbitron',monospace;font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:.12em;color:#bf00ff;text-shadow:0 0 30px #bf00ff;animation:gp 2s infinite alternate}
@keyframes gp{from{text-shadow:0 0 20px #bf00ff}to{text-shadow:0 0 45px #bf00ff,0 0 90px rgba(191,0,255,.3)}}
.tg{margin-top:.5rem;font-size:.85rem;color:rgba(191,0,255,.45);letter-spacing:.25em;text-transform:uppercase}
.frm{margin-top:2.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
input{background:transparent;border:1px solid #bf00ff;color:#bf00ff;font-family:'Orbitron',monospace;font-size:1rem;padding:.55rem 1.4rem;text-align:center;outline:none;box-shadow:0 0 10px rgba(191,0,255,.2);width:240px;letter-spacing:.1em}
input::placeholder{opacity:.3}
.btn{padding:.8rem 2.5rem;background:transparent;border:2px solid #bf00ff;color:#bf00ff;font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;letter-spacing:.2em;cursor:pointer;text-transform:uppercase;transition:all .18s;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:#bf00ff;transform:scaleX(0);transform-origin:left;transition:transform .18s;z-index:-1}
.btn:hover{color:#02020e}.btn:hover::before{transform:scaleX(1)}
.hint{margin-top:2rem;font-size:.7rem;color:rgba(191,0,255,.35);text-align:center;line-height:1.8}
.hint b{color:rgba(191,0,255,.6)}
#sg{display:none}
#gc{position:absolute;inset:0;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;top:14px;left:14px;background:rgba(2,2,14,.85);border:1px solid rgba(191,0,255,.2);padding:8px 13px;backdrop-filter:blur(4px)}
.hn{font-family:'Orbitron',monospace;font-size:.65rem;color:rgba(191,0,255,.55);letter-spacing:.14em;margin-bottom:3px}
.hbw{width:150px;height:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:3px}
#hb{height:100%;background:linear-gradient(90deg,#00ff88,#bf00ff);transition:width .18s}
.sr{font-size:.6rem;color:rgba(208,208,255,.35);display:flex;gap:10px}
.sr b{color:#ffff00}
#lb{position:absolute;top:14px;right:14px;background:rgba(2,2,14,.85);border:1px solid rgba(191,0,255,.18);padding:9px 14px;min-width:160px;backdrop-filter:blur(4px)}
#lb h3{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:.2em;color:#bf00ff;margin-bottom:7px;text-transform:uppercase}
.lbe{display:flex;justify-content:space-between;font-size:.6rem;padding:2px 0;color:rgba(208,208,255,.4);gap:8px}
.lbe.me{color:#00ffff}.lbe .lbs{color:#ffff00}
#mm{position:absolute;bottom:16px;right:16px;width:120px;height:120px;border:1px solid rgba(191,0,255,.13)}
#sd{display:none;background:rgba(2,2,14,.95);z-index:20;backdrop-filter:blur(8px)}
.dt{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,5vw,3.5rem);font-weight:900;color:#ff006e;text-shadow:0 0 28px #ff006e;letter-spacing:.1em;animation:fl .15s infinite alternate}
@keyframes fl{from{opacity:1}to{opacity:.85}}
.ds{margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem 2rem;font-size:.78rem;color:rgba(208,208,255,.38)}
.ds b{color:#bf00ff}
a.back{position:absolute;top:14px;left:14px;text-decoration:none;font-size:.7rem;color:rgba(191,0,255,.45);background:rgba(2,2,14,.8);border:1px solid rgba(191,0,255,.15);padding:5px 10px;transition:color .15s;z-index:50}
a.back:hover{color:#bf00ff}
#energy{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:200px;height:6px;background:rgba(255,255,255,.07)}
#eb{height:100%;background:linear-gradient(90deg,#00aaff,#bf00ff);transition:width .15s;box-shadow:0 0 8px #bf00ff}
</style>
</head>
<body>
<a class="back" href="index.html">← Wróć</a>
<div id="sm">
  <div class="logo">SPACE.IO</div>
  <div class="tg">Eksploruj · Walcz · Przeżyj</div>
  <div class="frm">
    <input id="pn" type="text" placeholder="PILOT_01" maxlength="14" spellcheck="false">
    <button class="btn" onclick="startGame()">▶ GRAJ</button>
  </div>
  <div class="hint"><b>WASD</b> — Silniki &nbsp;|&nbsp; <b>Mysz</b> — Cel &nbsp;|&nbsp; <b>LPM</b> — Laser<br><b>Shift</b> — Boost &nbsp;|&nbsp; Unikaj asteroid, niszcz wrogów!</div>
</div>
<div id="sg">
  <canvas id="gc"></canvas>
  <div id="hud">
    <div class="panel"><div class="hn" id="hn">PILOT</div><div class="hbw"><div id="hb" style="width:100%"></div></div><div class="sr">HP: <b id="hhp">100</b> &nbsp; Kills: <b id="hkl">0</b> &nbsp; Wynik: <b id="hpt">0</b></div></div>
    <div id="lb"><h3>Ranking</h3><div id="lbl"></div></div>
    <canvas id="mm"></canvas>
    <div style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:.6rem;color:rgba(191,0,255,.5)">ENERGIA BOOST</div>
    <div id="energy"><div id="eb" style="width:100%"></div></div>
  </div>
</div>
<div id="sd">
  <div class="dt">ZNISZCZONY</div>
  <div class="ds" id="dds"></div>
  <button class="btn" style="margin-top:1.8rem" onclick="respawn()">⟳ ZAGRAJ PONOWNIE</button>
</div>
<script>
const WORLD=4000,BOT_N=16,AST_N=35;
let cv,cx,mm,mx,P,bots=[],bullets=[],asteroids=[],stars=[],parts=[];
let keys={},mouse={x:0,y:0},mdown=false,running=false,lt=0,gtime=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const COLS=['#bf00ff','#00ffff','#ff006e','#00ff88','#ff8800','#ffff00','#ff44aa','#44aaff'];

function makePlayer(name){
  return{x:WORLD/2,y:WORLD/2,vx:0,vy:0,r:14,hp:100,maxHp:100,
    speed:220,dmg:20,fireCD:.22,fireT:0,angle:0,
    boost:100,boostMax:100,boostRegen:15,
    kills:0,score:0,name,color:'#00ffff',isPlayer:true,alive:true,trail:[]};
}
function makeBot(lv){
  const lv2=lv||Math.floor(rnd(1,4));const n=['NOVA-'+Math.floor(rnd(1,9)),'PULSAR','QUASAR','NEBUL','PHOTON','VEGA','RIGEL','SIRIUS','ALTAIR','DENEB'];
  return{x:rnd(100,WORLD-100),y:rnd(100,WORLD-100),vx:rnd(-40,40),vy:rnd(-40,40),
    r:12+lv2*1.5,hp:70+lv2*25,maxHp:70+lv2*25,speed:rnd(100,160)+lv2*12,
    dmg:16+lv2*5,fireCD:rnd(.35,.8),fireT:rnd(0,1),angle:rnd(0,Math.PI*2),
    kills:0,score:0,level:lv2,
    name:n[Math.floor(rnd(0,n.length))],color:COLS[Math.floor(rnd(0,COLS.length))],
    isPlayer:false,alive:true,tx:rnd(200,WORLD-200),ty:rnd(200,WORLD-200),
    wanderT:0,state:'wander',iFr:0,trail:[]};
}
function makeAsteroid(){
  const r=rnd(18,55),ang=rnd(0,Math.PI*2),spd=rnd(30,90);
  const side=Math.floor(rnd(0,4));let x,y;
  if(side===0){x=rnd(0,WORLD);y=0;}else if(side===1){x=WORLD;y=rnd(0,WORLD);}
  else if(side===2){x=rnd(0,WORLD);y=WORLD;}else{x=0;y=rnd(0,WORLD);}
  return{x,y,r,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,rot:0,rotSpd:rnd(-.8,.8),hp:Math.floor(r*2),maxHp:Math.floor(r*2),color:'#886644',alive:true};
}

function init(){
  cv=document.getElementById('gc');cx=cv.getContext('2d');
  mm=document.getElementById('mm');mx=mm.getContext('2d');mm.width=mm.height=120;
  stars=Array.from({length:200},()=>({x:rnd(0,WORLD),y:rnd(0,WORLD),r:rnd(.5,2.5),b:rnd(.2,1)}));
  resize();window.addEventListener('resize',resize);
  cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  cv.addEventListener('mousedown',()=>mdown=true);cv.addEventListener('mouseup',()=>mdown=false);
  window.addEventListener('keydown',e=>keys[e.code]=true);window.addEventListener('keyup',e=>keys[e.code]=false);
}
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}

function startGame(){
  const name=(document.getElementById('pn').value.trim().toUpperCase()||'PILOT_01').slice(0,14);
  document.getElementById('sm').style.display='none';document.getElementById('sg').style.display='block';document.getElementById('sd').style.display='none';
  P=makePlayer(name);bots=Array.from({length:BOT_N},()=>makeBot());
  bullets=[];asteroids=Array.from({length:AST_N},makeAsteroid);parts=[];
  running=true;gtime=0;document.getElementById('hn').textContent=P.name;
  if(!cv)init();requestAnimationFrame(loop);
}
function respawn(){document.getElementById('sd').style.display='none';startGame();}
function loop(ts){if(!running)return;const dt=Math.min((ts-lt)/1000,.05);lt=ts;gtime+=dt;update(dt);render();requestAnimationFrame(loop);}

function update(dt){
  while(bots.filter(b=>b.alive).length<BOT_N)bots.push(makeBot(Math.min(1+Math.floor(gtime/40),5)));
  while(asteroids.filter(a=>a.alive).length<AST_N)asteroids.push(makeAsteroid());
  updatePlayer(dt);updateBots(dt);updateBullets(dt);updateAsteroids(dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt*1.1;if(p.life<=0)parts.splice(i,1);}
  updateHUD();
}

function updatePlayer(dt){
  if(!P.alive)return;
  P.fireT=Math.max(0,P.fireT-dt);
  const wx=P.x-cv.width/2+mouse.x,wy=P.y-cv.height/2+mouse.y;
  P.angle=Math.atan2(wy-P.y,wx-P.x);
  let ax=0,ay=0;
  if(keys['KeyA']||keys['ArrowLeft'])ax-=1;if(keys['KeyD']||keys['ArrowRight'])ax+=1;
  if(keys['KeyW']||keys['ArrowUp'])ay-=1;if(keys['KeyS']||keys['ArrowDown'])ay+=1;
  const boosting=keys['ShiftLeft']&&P.boost>0;
  const thrust=P.speed*(boosting?2.2:1);
  if(boosting){P.boost=Math.max(0,P.boost-35*dt);}
  else{P.boost=Math.min(P.boostMax,P.boost+P.boostRegen*dt);}
  if(ax||ay){const l=Math.hypot(ax,ay);ax/=l;ay/=l;}
  // space-style physics
  P.vx+=ax*thrust*dt;P.vy+=ay*thrust*dt;
  const maxSpd=boosting?450:200;const spd=Math.hypot(P.vx,P.vy);
  if(spd>maxSpd){P.vx=P.vx/spd*maxSpd;P.vy=P.vy/spd*maxSpd;}
  P.vx*=0.97;P.vy*=0.97;
  P.x=clp(P.x+P.vx*dt,P.r,WORLD-P.r);P.y=clp(P.y+P.vy*dt,P.r,WORLD-P.r);
  // trail
  P.trail.unshift({x:P.x,y:P.y});if(P.trail.length>20)P.trail.pop();
  if(mdown&&P.fireT<=0){
    bullets.push({x:P.x,y:P.y,vx:Math.cos(P.angle)*550,vy:Math.sin(P.angle)*550,owner:P,r:4,color:P.color,dmg:P.dmg,life:1.2});
    P.fireT=P.fireCD;
  }
  // asteroid collision
  asteroids.filter(a=>a.alive).forEach(a=>{if(dst(P,a)<P.r+a.r){P.hp-=12;P.vx-=Math.cos(Math.atan2(P.y-a.y,P.x-a.x))*80;P.vy-=Math.sin(Math.atan2(P.y-a.y,P.x-a.x))*80;mkParts(P.x,P.y,'#886644',4);if(P.hp<=0){P.alive=false;gameOver();}}});
}

function updateBots(dt){
  bots.forEach(bot=>{
    if(!bot.alive)return;
    bot.fireT=Math.max(0,bot.fireT-dt);bot.iFr=Math.max(0,bot.iFr-dt);bot.wanderT=Math.max(0,bot.wanderT-dt);
    const d=dst(bot,P);
    if(d<400&&P.alive)bot.state='chase';
    else if(bot.wanderT<=0){bot.state='wander';bot.tx=rnd(100,WORLD-100);bot.ty=rnd(100,WORLD-100);bot.wanderT=rnd(3,6);}
    const tx=bot.state==='chase'?P.x:bot.tx,ty=bot.state==='chase'?P.y:bot.ty;
    const ang=Math.atan2(ty-bot.y,tx-bot.x);bot.angle=ang;
    bot.vx+=Math.cos(ang)*bot.speed*.08;bot.vy+=Math.sin(ang)*bot.speed*.08;
    const spd=Math.hypot(bot.vx,bot.vy);if(spd>bot.speed){bot.vx=bot.vx/spd*bot.speed;bot.vy=bot.vy/spd*bot.speed;}
    bot.vx*=.97;bot.vy*=.97;
    bot.x=clp(bot.x+bot.vx*dt,bot.r,WORLD-bot.r);bot.y=clp(bot.y+bot.vy*dt,bot.r,WORLD-bot.r);
    bot.trail=(bot.trail||[]);bot.trail.unshift({x:bot.x,y:bot.y});if(bot.trail.length>12)bot.trail.pop();
    if(bot.state==='chase'&&d<380&&bot.fireT<=0&&P.alive){
      const sp=rnd(-.1,.1);
      bullets.push({x:bot.x,y:bot.y,vx:Math.cos(ang+sp)*480,vy:Math.sin(ang+sp)*480,owner:bot,r:4,color:bot.color,dmg:bot.dmg,life:1.1});
      bot.fireT=bot.fireCD;
    }
    asteroids.filter(a=>a.alive).forEach(a=>{if(dst(bot,a)<bot.r+a.r){bot.hp-=8;mkParts(bot.x,bot.y,'#886644',3);if(bot.hp<=0&&bot.alive){bot.alive=false;mkParts(bot.x,bot.y,bot.color,16);}}});
  });
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<0||b.y<0||b.x>WORLD||b.y>WORLD){bullets.splice(i,1);continue;}
    let hit=false;
    // vs players/bots
    const tgts=[P,...bots].filter(e=>e!==b.owner&&e.alive&&e.iFr<=0);
    for(const t of tgts){if(dst(b,t)<t.r+b.r){t.hp-=b.dmg;t.iFr=.06;mkParts(b.x,b.y,b.color,4);if(t.hp<=0&&t.alive){t.alive=false;mkParts(t.x,t.y,t.color,18);if(b.owner.isPlayer){P.kills++;P.score+=80+t.level*20;}b.owner.kills++;b.owner.score+=80;}bullets.splice(i,1);hit=true;break;}}
    if(hit)continue;
    // vs asteroids
    for(let j=asteroids.length-1;j>=0;j--){const a=asteroids[j];if(!a.alive)continue;if(dst(b,a)<a.r+b.r){a.hp-=b.dmg;mkParts(b.x,b.y,'#cc9966',5);if(a.hp<=0){a.alive=false;mkParts(a.x,a.y,'#886644',12);if(b.owner.isPlayer){P.score+=20;}}bullets.splice(i,1);hit=true;break;}}
    if(!P.alive){gameOver();return;}
  }
}

function updateAsteroids(dt){
  asteroids.forEach(a=>{if(!a.alive)return;a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.rotSpd*dt;if(a.x<-100||a.x>WORLD+100||a.y<-100||a.y>WORLD+100)a.alive=false;});
}

function mkParts(x,y,col,n=8){for(let i=0;i<n;i++){const ang=rnd(0,Math.PI*2),s=rnd(40,180);parts.push({x,y,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s,r:rnd(2,5),color:col,life:1,ml:rnd(.3,.8)});}}

function render(){
  const W=cv.width,H=cv.height;
  const camX=P.alive?P.x:WORLD/2,camY=P.alive?P.y:WORLD/2;
  const ox=camX-W/2,oy=camY-H/2;
  cx.fillStyle='#02020e';cx.fillRect(0,0,W,H);
  cx.save();cx.translate(-ox,-oy);
  // stars
  stars.forEach(s=>{cx.globalAlpha=s.b;cx.fillStyle='#ffffff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill();});cx.globalAlpha=1;
  cx.strokeStyle='rgba(191,0,255,.12)';cx.lineWidth=2;cx.strokeRect(0,0,WORLD,WORLD);
  // asteroids
  asteroids.filter(a=>a.alive).forEach(a=>{
    cx.save();cx.translate(a.x,a.y);cx.rotate(a.rot);
    cx.shadowColor='#886644';cx.shadowBlur=6;
    cx.fillStyle='rgba(136,102,68,.3)';cx.strokeStyle='#886644';cx.lineWidth=2;
    cx.beginPath();for(let i=0;i<8;i++){const ang=i/8*Math.PI*2,rr=a.r*(0.75+Math.sin(i*2.3)*.25);i===0?cx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr):cx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);}
    cx.closePath();cx.fill();cx.stroke();cx.shadowBlur=0;cx.restore();
  });
  // parts
  parts.forEach(p=>{cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);cx.fill();cx.globalAlpha=1;});
  // trails
  const drawTrail=(e)=>{if(!e.trail||e.trail.length<2)return;cx.strokeStyle=e.color;cx.lineCap='round';for(let i=1;i<e.trail.length;i++){cx.globalAlpha=(1-i/e.trail.length)*.5;cx.lineWidth=e.r*.4*(1-i/e.trail.length);cx.beginPath();cx.moveTo(e.trail[i-1].x,e.trail[i-1].y);cx.lineTo(e.trail[i].x,e.trail[i].y);cx.stroke();}cx.globalAlpha=1;};
  bots.filter(b=>b.alive).forEach(drawTrail);if(P.alive)drawTrail(P);
  // entities
  bots.filter(b=>b.alive).forEach(b=>drawShip(b));if(P.alive)drawShip(P);
  // bullets
  bullets.forEach(b=>{cx.shadowColor=b.color;cx.shadowBlur=16;cx.fillStyle=b.color;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.strokeStyle=`rgba(255,255,255,.4)`;cx.lineWidth=1;cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-b.vx*.03,b.y-b.vy*.03);cx.stroke();cx.shadowBlur=0;});
  cx.restore();
  drawMM(camX,camY);updateHUD();
}

function drawShip(e){
  cx.save();cx.translate(e.x,e.y);cx.rotate(e.angle+Math.PI/2);
  const R=hexC(e.color);
  cx.shadowColor=e.color;cx.shadowBlur=e.isPlayer?18:10;
  cx.fillStyle=`rgba(${R},.15)`;cx.strokeStyle=e.color;cx.lineWidth=e.isPlayer?2.5:2;
  cx.beginPath();cx.moveTo(0,-e.r*1.4);cx.lineTo(e.r*.9,e.r);cx.lineTo(0,e.r*.5);cx.lineTo(-e.r*.9,e.r);cx.closePath();cx.fill();cx.stroke();
  cx.shadowBlur=0;cx.restore();
  const bw=e.r*2.6,bh=3,bx=e.x-bw/2,by=e.y-e.r-10;
  cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(bx,by,bw,bh);
  const fr=e.hp/e.maxHp,hc=fr>.5?'#00ff88':fr>.25?'#ffff00':'#ff006e';
  cx.fillStyle=hc;cx.fillRect(bx,by,bw*fr,bh);
  cx.fillStyle=e.isPlayer?'rgba(255,255,255,.9)':'rgba(208,208,255,.5)';
  cx.font=`10px "Share Tech Mono"`;cx.textAlign='center';cx.fillText(e.name,e.x,e.y+e.r+14);
}

function hexC(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return r+','+g+','+b;}

function drawMM(camX,camY){
  const s=120/WORLD;mx.fillStyle='rgba(2,2,14,.95)';mx.fillRect(0,0,120,120);
  asteroids.filter(a=>a.alive).forEach(a=>{mx.fillStyle='rgba(136,102,68,.5)';mx.beginPath();mx.arc(a.x*s,a.y*s,Math.max(1,a.r*s*.5),0,Math.PI*2);mx.fill();});
  bots.filter(b=>b.alive).forEach(b=>{mx.fillStyle=b.color;mx.beginPath();mx.arc(b.x*s,b.y*s,2.5,0,Math.PI*2);mx.fill();});
  if(P.alive){mx.fillStyle='#fff';mx.shadowColor='#fff';mx.shadowBlur=5;mx.beginPath();mx.arc(P.x*s,P.y*s,3.5,0,Math.PI*2);mx.fill();mx.shadowBlur=0;}
  mx.strokeStyle='rgba(191,0,255,.1)';mx.strokeRect(0,0,120,120);
}

function updateHUD(){
  if(!P.alive)return;
  document.getElementById('hb').style.width=(P.hp/P.maxHp*100)+'%';
  document.getElementById('hhp').textContent=Math.ceil(P.hp);
  document.getElementById('hkl').textContent=P.kills;
  document.getElementById('hpt').textContent=P.score;
  document.getElementById('eb').style.width=(P.boost/P.boostMax*100)+'%';
  const all=[P,...bots.filter(b=>b.alive)];all.sort((a,b)=>b.score-a.score);
  document.getElementById('lbl').innerHTML=all.slice(0,8).map((e,i)=>`<div class="lbe${e===P?' me':''}"><span style="color:rgba(255,255,255,.2)">#${i+1}</span><span>${e.name.slice(0,9)}</span><span class="lbs">${e.score}</span></div>`).join('');
}

function gameOver(){
  running=false;document.getElementById('sd').style.display='flex';
  const all=[P,...bots];all.sort((a,b)=>b.score-a.score);const rank=all.findIndex(e=>e===P)+1;
  document.getElementById('dds').innerHTML=`<div>Zniszczenia: <b>${P.kills}</b></div><div>Wynik: <b>${P.score}</b></div><div>Miejsce: <b>#${rank}</b></div><div>Czas: <b>${Math.floor(gtime)}s</b></div>`;
}

window.addEventListener('load',()=>{init();document.getElementById('pn').focus();document.getElementById('pn').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});});
</script>
</body>
