<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanks.io</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0a02;font-family:'Share Tech Mono',monospace;color:#ffe8a0;overflow:hidden;height:100vh;width:100vw;user-select:none}
#sm,#sg,#sd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sm{background:radial-gradient(ellipse at 50% 40%,#2a1a00,#0d0a02 70%);z-index:10}
.logo{font-family:'Orbitron',monospace;font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:.12em;color:#ffaa00;text-shadow:0 0 30px #ffaa00;animation:gp 2s infinite alternate}
@keyframes gp{from{text-shadow:0 0 20px #ffaa00}to{text-shadow:0 0 40px #ffaa00,0 0 80px rgba(255,170,0,.4)}}
.tg{margin-top:.5rem;font-size:.85rem;color:rgba(255,170,0,.45);letter-spacing:.25em;text-transform:uppercase}
.frm{margin-top:2.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
input{background:transparent;border:1px solid #ffaa00;color:#ffaa00;font-family:'Orbitron',monospace;font-size:1rem;padding:.55rem 1.4rem;text-align:center;outline:none;box-shadow:0 0 10px rgba(255,170,0,.2);width:240px;letter-spacing:.1em}
input::placeholder{opacity:.3}
.btn{padding:.8rem 2.5rem;background:transparent;border:2px solid #ffaa00;color:#ffaa00;font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;letter-spacing:.2em;cursor:pointer;text-transform:uppercase;transition:all .18s;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:#ffaa00;transform:scaleX(0);transform-origin:left;transition:transform .18s;z-index:-1}
.btn:hover{color:#0d0a02}.btn:hover::before{transform:scaleX(1)}
.hint{margin-top:2rem;font-size:.7rem;color:rgba(255,170,0,.35);text-align:center;line-height:1.8}
.hint b{color:rgba(255,170,0,.6)}
#sg{display:none}
#gc{position:absolute;inset:0;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;top:14px;left:14px;background:rgba(13,10,2,.85);border:1px solid rgba(255,170,0,.2);padding:8px 13px;backdrop-filter:blur(4px)}
.hn{font-family:'Orbitron',monospace;font-size:.65rem;color:rgba(255,170,0,.55);letter-spacing:.14em;margin-bottom:3px}
.hbw{width:150px;height:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:4px}
#hb{height:100%;background:linear-gradient(90deg,#00ff88,#ffff00);transition:width .18s}
.sr{font-size:.6rem;color:rgba(255,232,160,.35);display:flex;gap:10px}
.sr b{color:#ffff00}
#lb{position:absolute;top:14px;right:14px;background:rgba(13,10,2,.85);border:1px solid rgba(255,170,0,.18);padding:9px 14px;min-width:160px;backdrop-filter:blur(4px)}
#lb h3{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:.2em;color:#ffaa00;margin-bottom:7px;text-transform:uppercase}
.lbe{display:flex;justify-content:space-between;font-size:.6rem;padding:2px 0;color:rgba(255,232,160,.4);gap:8px}
.lbe.me{color:#00ffff}.lbe .lbs{color:#ffff00}
#mm{position:absolute;bottom:16px;right:16px;width:120px;height:120px;border:1px solid rgba(255,170,0,.13)}
#sd{display:none;background:rgba(13,10,2,.95);z-index:20;backdrop-filter:blur(8px)}
.dt{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,5vw,3.5rem);font-weight:900;color:#ff006e;text-shadow:0 0 28px #ff006e;letter-spacing:.1em;animation:fl .15s infinite alternate}
@keyframes fl{from{opacity:1}to{opacity:.85}}
.ds{margin-top:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem 2rem;font-size:.78rem;color:rgba(255,232,160,.38)}
.ds b{color:#ffaa00}
a.back{position:absolute;top:14px;left:14px;text-decoration:none;font-size:.7rem;color:rgba(255,170,0,.45);background:rgba(13,10,2,.8);border:1px solid rgba(255,170,0,.15);padding:5px 10px;transition:color .15s;z-index:50}
a.back:hover{color:#ffaa00}
#upgPanel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:all}
.upgBtn{padding:7px 14px;background:rgba(13,10,2,.9);border:1px solid rgba(255,170,0,.3);color:#ffaa00;font-family:'Orbitron',monospace;font-size:.6rem;cursor:pointer;transition:all .15s}
.upgBtn:hover{background:rgba(255,170,0,.15);border-color:#ffaa00}
.upgBtn:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body>
<a class="back" href="index.html">← Wróć</a>
<div id="sm">
  <div class="logo">TANKS.IO</div>
  <div class="tg">Niszcz · Ulepszaj · Dominuj</div>
  <div class="frm">
    <input id="pn" type="text" placeholder="TANK_01" maxlength="14" spellcheck="false">
    <button class="btn" onclick="startGame()">▶ GRAJ</button>
  </div>
  <div class="hint"><b>WASD</b> — Ruch &nbsp;|&nbsp; <b>Mysz</b> — Cel &nbsp;|&nbsp; <b>LPM</b> — Strzał<br>Zbieraj żółte kryształy aby ulepszać czołg!</div>
</div>
<div id="sg">
  <canvas id="gc"></canvas>
  <div id="hud">
    <div class="panel"><div class="hn" id="hn">TANK</div><div class="hbw"><div id="hb" style="width:100%"></div></div><div class="sr">HP: <b id="hhp">100</b> &nbsp; Kills: <b id="hkl">0</b> &nbsp; Pts: <b id="hpt">0</b> &nbsp; Kryształy: <b id="hcr">0</b></div></div>
    <div id="lb"><h3>Ranking</h3><div id="lbl"></div></div>
    <canvas id="mm"></canvas>
    <div id="upgPanel">
      <button class="upgBtn" id="u0" onclick="upgrade('dmg')">🔥 DMG (5💎)</button>
      <button class="upgBtn" id="u1" onclick="upgrade('spd')">💨 SPD (5💎)</button>
      <button class="upgBtn" id="u2" onclick="upgrade('hp')">❤️ HP (5💎)</button>
      <button class="upgBtn" id="u3" onclick="upgrade('fire')">⚡ FIRE (8💎)</button>
    </div>
  </div>
</div>
<div id="sd">
  <div class="dt">ZNISZCZONY</div>
  <div class="ds" id="dds"></div>
  <button class="btn" style="margin-top:1.8rem" onclick="respawn()">⟳ ZAGRAJ PONOWNIE</button>
</div>
<script>
const WORLD=3200,BOT_N=18,CRYST_N=60;
let cv,cx,mm,mx,P,bots=[],bullets=[],crystals=[],parts=[];
let keys={},mouse={x:0,y:0},mdown=false,running=false,lt=0,gtime=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const COLS=['#ffaa00','#ff006e','#00ffff','#00ff88','#ff4444','#bf00ff','#ff8800','#44ffaa'];

function makePlayer(name){
  return{x:WORLD/2,y:WORLD/2,vx:0,vy:0,r:16,hp:120,maxHp:120,
    speed:160,dmg:22,fireCD:0.28,fireT:0,kills:0,score:0,
    name,color:'#00ffff',isPlayer:true,alive:true,
    angle:0,crystals:0,
    upg:{dmg:0,spd:0,hp:0,fire:0}};
}
function makeBot(lv){
  const lv2=lv||Math.floor(rnd(1,4));
  const NAMS=['T-72','ABRAMS','LEOPARD','TIGER','PANZER','MERKAVA','CHALLENGER','LECLERC'];
  const col=COLS[Math.floor(rnd(0,COLS.length))];
  return{x:rnd(100,WORLD-100),y:rnd(100,WORLD-100),vx:0,vy:0,r:15+lv2,
    hp:80+lv2*30,maxHp:80+lv2*30,speed:rnd(95,145)+lv2*8,
    dmg:18+lv2*6,fireCD:rnd(.4,.9)-lv2*.05,fireT:rnd(0,1),
    kills:0,score:0,name:NAMS[Math.floor(rnd(0,NAMS.length))]+'-'+lv2,
    color:col,isPlayer:false,alive:true,level:lv2,angle:0,
    tx:rnd(200,WORLD-200),ty:rnd(200,WORLD-200),wanderT:0,
    state:'wander',iFr:0};
}
function mkCrystal(){return{x:rnd(60,WORLD-60),y:rnd(60,WORLD-60),r:rnd(5,9),pulse:rnd(0,Math.PI*2)};}
function mkBullet(owner,tx,ty){
  const a=Math.atan2(ty-owner.y,tx-owner.x);const spd=420+owner.level*15||420;
  return{x:owner.x+Math.cos(a)*(owner.r+10),y:owner.y+Math.sin(a)*(owner.r+10),
    vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,owner,r:6,color:owner.color,dmg:owner.dmg,life:1.6,iFr:0};
}
function mkParts(x,y,col,n=10){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(50,220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(2,5),color:col,life:1,ml:rnd(.4,.9)});}}

function upgrade(type){
  const cost=type==='fire'?8:5;
  if(P.crystals<cost)return;
  P.crystals-=cost;
  if(type==='dmg'){P.dmg+=8;P.upg.dmg++;}
  if(type==='spd'){P.speed+=18;P.upg.spd++;}
  if(type==='hp'){P.maxHp+=40;P.hp=Math.min(P.hp+40,P.maxHp);P.upg.hp++;}
  if(type==='fire'){P.fireCD=Math.max(.1,P.fireCD*.75);P.upg.fire++;}
}

function init(){
  cv=document.getElementById('gc');cx=cv.getContext('2d');
  mm=document.getElementById('mm');mx=mm.getContext('2d');mm.width=mm.height=120;
  resize();window.addEventListener('resize',resize);
  cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  cv.addEventListener('mousedown',()=>mdown=true);cv.addEventListener('mouseup',()=>mdown=false);
  window.addEventListener('keydown',e=>keys[e.code]=true);window.addEventListener('keyup',e=>keys[e.code]=false);
}
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}

function startGame(){
  const name=(document.getElementById('pn').value.trim().toUpperCase()||'TANK_01').slice(0,14);
  document.getElementById('sm').style.display='none';document.getElementById('sg').style.display='block';document.getElementById('sd').style.display='none';
  P=makePlayer(name);bots=Array.from({length:BOT_N},()=>makeBot());
  bullets=[];crystals=Array.from({length:CRYST_N},mkCrystal);parts=[];
  running=true;gtime=0;document.getElementById('hn').textContent=P.name;
  if(!cv)init();requestAnimationFrame(loop);
}
function respawn(){document.getElementById('sd').style.display='none';startGame();}
function loop(ts){if(!running)return;const dt=Math.min((ts-lt)/1000,.05);lt=ts;gtime+=dt;update(dt);render();requestAnimationFrame(loop);}

function update(dt){
  while(bots.filter(b=>b.alive).length<BOT_N)bots.push(makeBot(Math.min(1+Math.floor(gtime/35),5)));
  updatePlayer(dt);updateBots(dt);updateBullets(dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.88;p.vy*=.88;p.life-=dt/p.ml;if(p.life<=0)parts.splice(i,1);}
  updateHUD();
}

function updatePlayer(dt){
  if(!P.alive)return;
  P.fireT=Math.max(0,P.fireT-dt);
  let dx=0,dy=0;
  if(keys['KeyA']||keys['ArrowLeft'])dx-=1;if(keys['KeyD']||keys['ArrowRight'])dx+=1;
  if(keys['KeyW']||keys['ArrowUp'])dy-=1;if(keys['KeyS']||keys['ArrowDown'])dy+=1;
  if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;}
  P.vx=dx*P.speed;P.vy=dy*P.speed;
  P.x=clp(P.x+P.vx*dt,P.r,WORLD-P.r);P.y=clp(P.y+P.vy*dt,P.r,WORLD-P.r);
  const wx=P.x-cv.width/2+mouse.x,wy=P.y-cv.height/2+mouse.y;
  P.angle=Math.atan2(wy-P.y,wx-P.x);
  if(mdown&&P.fireT<=0){bullets.push(mkBullet(P,wx,wy));P.fireT=P.fireCD;}
  // crystals
  for(let i=crystals.length-1;i>=0;i--){if(dst(P,crystals[i])<P.r+crystals[i].r){P.crystals+=1;P.score+=5;crystals.splice(i,1);crystals.push(mkCrystal());}}
}

function updateBots(dt){
  bots.forEach(bot=>{
    if(!bot.alive)return;
    bot.fireT=Math.max(0,bot.fireT-dt);bot.iFr=Math.max(0,bot.iFr-dt);bot.wanderT=Math.max(0,bot.wanderT-dt);
    const d=dst(bot,P);
    if(d<380&&P.alive)bot.state='chase';
    else if(bot.wanderT<=0){bot.state='wander';bot.tx=rnd(100,WORLD-100);bot.ty=rnd(100,WORLD-100);bot.wanderT=rnd(3,6);}
    const tx=bot.state==='chase'?P.x:bot.tx,ty=bot.state==='chase'?P.y:bot.ty;
    const ang=Math.atan2(ty-bot.y,tx-bot.x);
    bot.vx=Math.cos(ang)*bot.speed;bot.vy=Math.sin(ang)*bot.speed;
    bot.x=clp(bot.x+bot.vx*dt,bot.r,WORLD-bot.r);bot.y=clp(bot.y+bot.vy*dt,bot.r,WORLD-bot.r);
    bot.angle=ang;
    if(bot.state==='chase'&&d<350&&bot.fireT<=0&&P.alive){
      const spread=rnd(-0.12,0.12);const a=ang+spread;
      bullets.push({x:bot.x+Math.cos(a)*(bot.r+10),y:bot.y+Math.sin(a)*(bot.r+10),vx:Math.cos(a)*400,vy:Math.sin(a)*400,owner:bot,r:5,color:bot.color,dmg:bot.dmg,life:1.5,iFr:0});
      bot.fireT=bot.fireCD;
    }
    for(let i=crystals.length-1;i>=0;i--){if(dst(bot,crystals[i])<bot.r+crystals[i].r){bot.score+=5;crystals.splice(i,1);crystals.push(mkCrystal());}}
  });
}

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<0||b.y<0||b.x>WORLD||b.y>WORLD){bullets.splice(i,1);continue;}
    const tgts=[P,...bots].filter(e=>e!==b.owner&&e.alive&&e.iFr<=0);
    let hit=false;
    for(const t of tgts){
      if(dst(b,t)<t.r+b.r){
        t.hp-=b.dmg;t.iFr=.06;mkParts(b.x,b.y,b.color,5);
        if(b.owner.isPlayer&&!t.isPlayer) mkFloatTank(t.x,t.y,'-'+Math.ceil(b.dmg));
        if(t.hp<=0&&t.alive){
          t.alive=false;mkParts(t.x,t.y,t.color,18);
          if(b.owner.isPlayer){P.kills++;P.score+=80+t.level*20;P.crystals+=3;}
          b.owner.kills++;b.owner.score+=80;
        }
        bullets.splice(i,1);hit=true;break;
      }
    }
    if(!P.alive){gameOver();return;}
  }
}

let tankFloats=[];
function mkFloatTank(x,y,txt){tankFloats.push({x,y,text:txt,life:1});}

function render(){
  const W=cv.width,H=cv.height;
  const camX=P.alive?P.x:WORLD/2,camY=P.alive?P.y:WORLD/2;
  const ox=camX-W/2,oy=camY-H/2;
  cx.fillStyle='#0d0a02';cx.fillRect(0,0,W,H);
  cx.save();cx.translate(-ox,-oy);
  // grid
  cx.strokeStyle='rgba(80,60,0,.15)';cx.lineWidth=1;
  const step=80,sx=Math.floor(ox/step)*step,sy=Math.floor(oy/step)*step;
  for(let x=sx;x<ox+W+step;x+=step){cx.beginPath();cx.moveTo(x,oy);cx.lineTo(x,oy+H);cx.stroke();}
  for(let y=sy;y<oy+H+step;y+=step){cx.beginPath();cx.moveTo(ox,y);cx.lineTo(ox+W,y);cx.stroke();}
  cx.strokeStyle='rgba(255,170,0,.18)';cx.lineWidth=3;cx.strokeRect(0,0,WORLD,WORLD);
  // crystals
  crystals.forEach(c=>{c.pulse+=.06;const s=1+Math.sin(c.pulse)*.2;cx.save();cx.translate(c.x,c.y);cx.scale(s,s);cx.shadowColor='#ffdd00';cx.shadowBlur=12;cx.fillStyle='#ffdd00';cx.beginPath();cx.moveTo(0,-c.r);cx.lineTo(c.r*.7,c.r*.5);cx.lineTo(-c.r*.7,c.r*.5);cx.closePath();cx.fill();cx.shadowBlur=0;cx.restore();});
  // parts
  parts.forEach(p=>{cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);cx.fill();cx.globalAlpha=1;});
  // entities
  bots.filter(b=>b.alive).forEach(b=>drawTank(b));if(P.alive)drawTank(P);
  // bullets
  bullets.forEach(b=>{cx.shadowColor=b.color;cx.shadowBlur=12;cx.fillStyle=b.color;cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();cx.shadowBlur=0;});
  // floats
  for(let i=tankFloats.length-1;i>=0;i--){const f=tankFloats[i];f.y-=38*(1/60);f.life-=1/60;cx.globalAlpha=f.life;cx.font="bold 12px 'Orbitron'";cx.textAlign='center';cx.fillStyle='#ffff00';cx.fillText(f.text,f.x,f.y);cx.globalAlpha=1;if(f.life<=0)tankFloats.splice(i,1);}
  cx.restore();
  drawMM(camX,camY);
}

function drawTank(e){
  cx.save();cx.translate(e.x,e.y);
  // body
  cx.shadowColor=e.color;cx.shadowBlur=e.isPlayer?16:10;
  cx.fillStyle=`rgba(${hexR(e.color)},.18)`;cx.strokeStyle=e.color;cx.lineWidth=e.isPlayer?2.5:2;
  cx.beginPath();cx.rect(-e.r,-e.r*.8,e.r*2,e.r*1.6);cx.fill();cx.stroke();
  // tracks
  cx.fillStyle=`rgba(${hexR(e.color)},.3)`;
  cx.fillRect(-e.r,-e.r*.9,e.r*.3,e.r*1.8);cx.fillRect(e.r*.7,-e.r*.9,e.r*.3,e.r*1.8);
  // turret
  cx.rotate(e.angle);cx.fillStyle=e.color;cx.shadowBlur=6;
  cx.beginPath();cx.arc(0,0,e.r*.55,0,Math.PI*2);cx.fill();
  // barrel
  cx.fillStyle=e.color;cx.fillRect(0,-e.r*.15,e.r*1.35,e.r*.3);
  cx.shadowBlur=0;cx.restore();
  // HP bar
  const bw=e.r*2.5,bh=4,bx=e.x-bw/2,by=e.y-e.r-12;
  cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(bx,by,bw,bh);
  const fr=e.hp/e.maxHp,hc=fr>.5?'#00ff88':fr>.25?'#ffff00':'#ff006e';
  cx.fillStyle=hc;cx.fillRect(bx,by,bw*fr,bh);
  cx.fillStyle=e.isPlayer?'rgba(255,255,255,.9)':'rgba(255,232,160,.5)';
  cx.font=`${e.isPlayer?'bold ':''} 10px "Share Tech Mono"`;cx.textAlign='center';
  cx.fillText(e.name,e.x,e.y+e.r+16);
}

function hexR(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return r+','+g+','+b;}

function drawMM(camX,camY){
  const s=120/WORLD;mx.fillStyle='rgba(13,10,2,.94)';mx.fillRect(0,0,120,120);
  bots.filter(b=>b.alive).forEach(b=>{mx.fillStyle=b.color;mx.beginPath();mx.arc(b.x*s,b.y*s,2.5,0,Math.PI*2);mx.fill();});
  if(P.alive){mx.fillStyle='#fff';mx.shadowColor='#fff';mx.shadowBlur=5;mx.beginPath();mx.arc(P.x*s,P.y*s,3.5,0,Math.PI*2);mx.fill();mx.shadowBlur=0;}
  mx.strokeStyle='rgba(255,170,0,.1)';mx.strokeRect(0,0,120,120);
}

function updateHUD(){
  if(!P.alive)return;
  document.getElementById('hb').style.width=(P.hp/P.maxHp*100)+'%';
  document.getElementById('hhp').textContent=Math.ceil(P.hp)+'/'+P.maxHp;
  document.getElementById('hkl').textContent=P.kills;
  document.getElementById('hpt').textContent=P.score;
  document.getElementById('hcr').textContent=P.crystals+'💎';
  ['u0','u1','u2','u3'].forEach((id,i)=>{const costs=[5,5,5,8];document.getElementById(id).disabled=P.crystals<costs[i];});
  const all=[P,...bots.filter(b=>b.alive)];all.sort((a,b)=>b.score-a.score);
  document.getElementById('lbl').innerHTML=all.slice(0,8).map((e,i)=>`<div class="lbe${e===P?' me':''}"><span style="color:rgba(255,255,255,.2)">#${i+1}</span><span>${e.name.slice(0,9)}</span><span class="lbs">${e.score}</span></div>`).join('');
}

function gameOver(){
  running=false;document.getElementById('sd').style.display='flex';
  const all=[P,...bots];all.sort((a,b)=>b.score-a.score);const rank=all.findIndex(e=>e===P)+1;
  document.getElementById('dds').innerHTML=`<div>Zabójstwa: <b>${P.kills}</b></div><div>Wynik: <b>${P.score}</b></div><div>Miejsce: <b>#${rank}</b></div><div>Czas: <b>${Math.floor(gtime)}s</b></div>`;
}

window.addEventListener('load',()=>{init();document.getElementById('pn').focus();document.getElementById('pn').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});});
</script>
</body>
